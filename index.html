<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legal Dictionary &amp; Thesaurus</title>
  <style>
    :root {
      --bg: #f7f5f0;
      --paper: #ffffff;
      --ink: #1d1d1f;
      --muted: #6b6b70;
      --accent: #6b2c2c;
      --accent-soft: #f1e6e6;
      --border: #e3ddd2;
      --chip-bg: #efeae0;
      --chip-bg-hover: #e3dccb;
      --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Charter', 'Georgia', 'Times New Roman', serif;
      font-size: 17px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 32px;
      letter-spacing: -0.01em;
      margin: 0 0 6px;
      font-weight: 700;
    }
    .tagline {
      color: var(--muted);
      font-size: 15px;
      font-style: italic;
      margin: 0;
    }
    .search-box {
      position: relative;
      margin: 24px 0 18px;
    }
    .search-box input {
      width: 100%;
      padding: 14px 18px 14px 46px;
      font-size: 17px;
      font-family: inherit;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--ink);
      box-shadow: var(--shadow);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      stroke: var(--muted);
      pointer-events: none;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .cat-pill {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cat-pill:hover { background: var(--chip-bg); color: var(--ink); }
    .cat-pill.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .results-meta {
      color: var(--muted);
      font-size: 13px;
      margin: 8px 4px 16px;
      font-style: italic;
    }
    .entry {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 26px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .entry-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .term {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0;
    }
    .category {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }
    .definition {
      margin: 8px 0 14px;
      color: var(--ink);
    }
    .plain {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      border-radius: 4px;
      font-style: italic;
      color: #4a1e1e;
      margin: 12px 0;
      font-size: 16px;
    }
    .plain::before {
      content: "Plain English: ";
      font-weight: 700;
      font-style: normal;
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 3px;
    }
    .group {
      margin-top: 12px;
    }
    .group-label {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 6px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      background: var(--chip-bg);
      color: var(--ink);
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: background 0.12s;
    }
    .chip:hover { background: var(--chip-bg-hover); }
    .chip.unknown { opacity: 0.55; cursor: default; }
    .chip.unknown:hover { background: var(--chip-bg); }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-style: italic;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 60px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--muted); }
    @media (max-width: 520px) {
      h1 { font-size: 26px; }
      .entry { padding: 18px 18px; }
      .term { font-size: 21px; }
      body { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Legal Dictionary &amp; Thesaurus</h1>
      <p class="tagline">Look up a term, find synonyms, see plain-English meanings.</p>
    </header>

    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="search" type="search" placeholder="Search a term, synonym, or concept (e.g. 'estoppel', 'lying under oath')" autocomplete="off" autofocus />
    </div>

    <div class="controls" id="categories"></div>

    <div class="results-meta" id="meta"></div>
    <div id="results"></div>

    <footer>
      <span id="count"></span> &middot; Not legal advice. For general reference only.
    </footer>
  </div>

  <script>
    let TERMS = [];
    let activeCategory = 'All';
    let query = '';

    const $search = document.getElementById('search');
    const $results = document.getElementById('results');
    const $meta = document.getElementById('meta');
    const $cats = document.getElementById('categories');
    const $count = document.getElementById('count');

    function norm(s) { return (s || '').toLowerCase().trim(); }

    function scoreEntry(entry, q) {
      if (!q) return 1;
      const term = norm(entry.term);
      const syns = (entry.synonyms || []).map(norm);
      const rel = (entry.related || []).map(norm);
      const def = norm(entry.definition);
      const plain = norm(entry.plainEnglish);

      if (term === q) return 1000;
      if (syns.includes(q)) return 900;
      if (term.startsWith(q)) return 800;
      if (syns.some(s => s.startsWith(q))) return 700;
      if (term.includes(q)) return 600;
      if (syns.some(s => s.includes(q))) return 500;
      if (rel.includes(q)) return 400;
      if (rel.some(r => r.includes(q))) return 300;
      if (plain.includes(q)) return 200;
      if (def.includes(q)) return 100;
      return 0;
    }

    function findByTerm(name) {
      const n = norm(name);
      return TERMS.find(t => norm(t.term) === n)
          || TERMS.find(t => (t.synonyms || []).some(s => norm(s) === n));
    }

    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function renderChip(label, knownExists) {
      const safe = escapeHtml(label);
      if (knownExists) {
        return `<button class="chip" data-jump="${safe}">${safe}</button>`;
      }
      return `<span class="chip unknown" title="No entry">${safe}</span>`;
    }

    function renderEntry(entry) {
      const synChips = (entry.synonyms || []).map(s => renderChip(s, !!findByTerm(s))).join('');
      const relChips = (entry.related || []).map(r => renderChip(r, !!findByTerm(r))).join('');
      return `
        <article class="entry">
          <div class="entry-head">
            <h2 class="term">${escapeHtml(entry.term)}</h2>
            <span class="category">${escapeHtml(entry.category)}</span>
          </div>
          <p class="definition">${escapeHtml(entry.definition)}</p>
          ${entry.plainEnglish ? `<div class="plain">${escapeHtml(entry.plainEnglish)}</div>` : ''}
          ${synChips ? `<div class="group"><div class="group-label">Synonyms</div><div class="chips">${synChips}</div></div>` : ''}
          ${relChips ? `<div class="group"><div class="group-label">Related</div><div class="chips">${relChips}</div></div>` : ''}
        </article>
      `;
    }

    function render() {
      const q = norm(query);
      let list = TERMS.slice();

      if (activeCategory !== 'All') {
        list = list.filter(t => t.category === activeCategory);
      }

      if (q) {
        list = list
          .map(t => ({ t, score: scoreEntry(t, q) }))
          .filter(x => x.score > 0)
          .sort((a, b) => b.score - a.score || a.t.term.localeCompare(b.t.term))
          .map(x => x.t);
      } else {
        list.sort((a, b) => a.term.localeCompare(b.term));
      }

      if (q) {
        $meta.textContent = list.length === 0
          ? `No matches for "${query}". Try a different word.`
          : `${list.length} match${list.length === 1 ? '' : 'es'} for "${query}"`;
      } else if (activeCategory !== 'All') {
        $meta.textContent = `${list.length} terms in ${activeCategory}`;
      } else {
        $meta.textContent = `Browse all ${list.length} terms or search above.`;
      }

      if (list.length === 0) {
        $results.innerHTML = `<div class="empty">Nothing found.</div>`;
      } else {
        $results.innerHTML = list.map(renderEntry).join('');
      }
    }

    function renderCategories() {
      const cats = ['All', ...Array.from(new Set(TERMS.map(t => t.category))).sort()];
      $cats.innerHTML = cats.map(c =>
        `<button class="cat-pill ${c === activeCategory ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`
      ).join('');
    }

    $cats.addEventListener('click', e => {
      const btn = e.target.closest('.cat-pill');
      if (!btn) return;
      activeCategory = btn.dataset.cat;
      renderCategories();
      render();
    });

    $results.addEventListener('click', e => {
      const btn = e.target.closest('[data-jump]');
      if (!btn) return;
      const name = btn.dataset.jump;
      $search.value = name;
      query = name;
      activeCategory = 'All';
      renderCategories();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    $search.addEventListener('input', e => {
      query = e.target.value;
      render();
    });

    fetch('terms.json')
      .then(r => r.json())
      .then(data => {
        TERMS = data;
        $count.textContent = `${TERMS.length} terms`;
        renderCategories();
        render();
      })
      .catch(err => {
        $results.innerHTML = `<div class="empty">Could not load terms.json. ${escapeHtml(err.message)}</div>`;
      });
  </script>
</body>
</html>
