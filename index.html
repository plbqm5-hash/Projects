<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolpers Waterfountain Rip</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            touch-action: none;
        }
        canvas {
            border: 6px solid #444;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        #instructions {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            pointer-events: none;
            text-align: center;
        }
        #title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #f5c542;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.9);
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
        #subtitle {
            position: absolute;
            top: 38px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 12px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            pointer-events: none;
        }
        #timer {
            position: absolute;
            top: 58px;
            left: 50%;
            transform: translateX(-50%);
            color: #0f0;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.9);
            pointer-events: none;
            font-family: 'Courier New', monospace;
        }
        #message {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.95);
            pointer-events: none;
            opacity: 0;
            text-align: center;
        }
        #mobileControls {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
        }
        .mobileBtn {
            width: 70px;
            height: 70px;
            background: rgba(255,255,255,0.2);
            border: 3px solid #fff;
            border-radius: 15px;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
        }
        .mobileBtn:active {
            background: rgba(255,255,255,0.5);
        }
        #leaderboard {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 10px 12px;
            border-radius: 10px;
            border: 2px solid #f5c542;
            color: #fff;
            font-size: 11px;
            min-width: 140px;
        }
        #leaderboard h3 {
            color: #f5c542;
            margin-bottom: 6px;
            font-size: 13px;
            text-align: center;
        }
        #leaderboard ol {
            padding-left: 18px;
            margin: 0;
        }
        #leaderboard li {
            margin: 3px 0;
        }
        .record-time {
            color: #0f0;
            font-family: 'Courier New', monospace;
        }
        #nameModal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 30px;
            border-radius: 15px;
            border: 3px solid #f5c542;
            text-align: center;
            z-index: 100;
        }
        #nameModal h2 {
            color: #f5c542;
            margin-bottom: 10px;
        }
        #nameModal p {
            color: #0f0;
            font-size: 24px;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
        }
        #nameModal input {
            padding: 10px 15px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            margin-bottom: 15px;
            width: 200px;
            text-align: center;
        }
        #nameModal button {
            padding: 10px 30px;
            font-size: 18px;
            background: #f5c542;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #nameModal button:hover {
            background: #ffd700;
        }
        #restartBtn {
            display: none;
            position: absolute;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            font-size: 18px;
            background: #f5c542;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        #restartBtn:hover {
            background: #ffd700;
        }
        #loadingMsg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f5c542;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="title">WOLPERS WATERFOUNTAIN RIP</div>
        <div id="subtitle">Mizzou - Late Night</div>
        <div id="timer">0.000s</div>
        <div id="instructions">Mash LEFT and RIGHT arrow keys to rip it off!</div>
        <div id="message"></div>
        <div id="mobileControls">
            <button class="mobileBtn" id="leftBtn">&#8592;</button>
            <button class="mobileBtn" id="rightBtn">&#8594;</button>
        </div>
        <div id="leaderboard">
            <h3>WORLD RECORDS</h3>
            <ol id="leaderboardList">
                <li style="color:#888">Loading...</li>
            </ol>
        </div>
        <div id="nameModal">
            <h2>NEW RECORD!</h2>
            <p id="finalTime">0.000s</p>
            <input type="text" id="playerName" placeholder="Enter your name" maxlength="12">
            <br>
            <button id="submitName">SUBMIT</button>
        </div>
        <button id="restartBtn">PLAY AGAIN</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const messageEl = document.getElementById('message');
        const instructionsEl = document.getElementById('instructions');
        const timerEl = document.getElementById('timer');
        const leaderboardList = document.getElementById('leaderboardList');
        const nameModal = document.getElementById('nameModal');
        const finalTimeEl = document.getElementById('finalTime');
        const playerNameInput = document.getElementById('playerName');
        const submitNameBtn = document.getElementById('submitName');
        const restartBtn = document.getElementById('restartBtn');

        function resizeCanvas() {
            const maxWidth = Math.min(800, window.innerWidth - 20);
            const maxHeight = Math.min(600, window.innerHeight - 20);
            canvas.width = maxWidth;
            canvas.height = maxHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ============================================
        // SHARED LEADERBOARD CONFIG - JSONbin.io
        // ============================================
        // SETUP INSTRUCTIONS:
        // 1. Go to https://jsonbin.io and create a FREE account
        // 2. From the dashboard, copy your "X-Master-Key"
        // 3. Paste it below replacing 'YOUR_API_KEY_HERE'
        // 4. The bin will be created automatically on first load
        // ============================================
        const JSONBIN_API_KEY = '$2a$10$bwd8sBLymHSBFJlo1gOqQ.ybCoTf2qCoIaK8dDl4bOWRupbufmyT2';
        const JSONBIN_BIN_ID = '6995cd52ae596e708f3486ca'; // Shared bin for everyone

        let leaderboard = [];

        // Load the shared leaderboard
        async function initLeaderboard() {
            try {
                await loadLeaderboard();
            } catch (error) {
                console.error('Error initializing leaderboard:', error);
                leaderboard = [];
                updateLeaderboardDisplay();
            }
        }

        async function loadLeaderboard() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: {
                        'X-Master-Key': JSONBIN_API_KEY
                    }
                });
                const data = await response.json();
                leaderboard = data.record.leaderboard || [];
                updateLeaderboardDisplay();
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                leaderboard = [];
                updateLeaderboardDisplay();
            }
        }

        async function saveLeaderboard() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify({ leaderboard: leaderboard })
                });
            } catch (error) {
                console.error('Error saving leaderboard:', error);
            }
        }

        function updateLeaderboardDisplay() {
            leaderboardList.innerHTML = '';
            const top5 = leaderboard.slice(0, 5);
            if (top5.length === 0) {
                leaderboardList.innerHTML = '<li style="color:#888">No records yet!</li>';
                return;
            }
            top5.forEach((entry, i) => {
                const li = document.createElement('li');
                li.innerHTML = `${entry.name}: <span class="record-time">${entry.time.toFixed(3)}s</span>`;
                leaderboardList.appendChild(li);
            });
        }

        function checkNewRecord(time) {
            if (leaderboard.length < 5) return true;
            return time < leaderboard[leaderboard.length - 1].time;
        }

        async function addToLeaderboard(name, time) {
            leaderboard.push({ name, time, date: Date.now() });
            leaderboard.sort((a, b) => a.time - b.time);
            leaderboard = leaderboard.slice(0, 10); // Keep top 10
            await saveLeaderboard();
            updateLeaderboardDisplay();
        }

        // Initialize leaderboard on load
        initLeaderboard();

        // Game state
        let progress = 0;
        let lastKey = null;
        let frameCount = 0;
        let gameWon = false;
        let gameStarted = false;
        let shakeAmount = 0;
        let jamesAnger = 0;
        let pullDirection = 0;
        let fountainOffset = 0;
        let hulkTimer = 0;
        let hulkPose = 0;
        let startTime = 0;
        let endTime = 0;
        let currentTime = 0;

        const students = [
            { x: 0.08, y: 0.75 },
            { x: 0.18, y: 0.8 },
            { x: 0.82, y: 0.75 },
            { x: 0.92, y: 0.8 }
        ];

        function drawHallway() {
            ctx.fillStyle = '#8b7355';
            ctx.fillRect(0, canvas.height * 0.65, canvas.width, canvas.height * 0.35);

            ctx.strokeStyle = '#6b5344';
            ctx.lineWidth = 2;
            for (let x = 0; x < canvas.width; x += 60) {
                ctx.beginPath();
                ctx.moveTo(x, canvas.height * 0.65);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            ctx.fillStyle = '#d4c4a8';
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.65);

            ctx.strokeStyle = '#c4b498';
            ctx.lineWidth = 3;
            for (let x = 0; x < canvas.width; x += 120) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height * 0.65);
                ctx.stroke();
            }

            ctx.fillStyle = '#5a4a3a';
            ctx.fillRect(0, canvas.height * 0.62, canvas.width, canvas.height * 0.03);

            ctx.fillStyle = '#c4b498';
            ctx.fillRect(0, 0, canvas.width, 15);

            for (let x = canvas.width * 0.25; x < canvas.width; x += canvas.width * 0.5) {
                ctx.fillStyle = '#fff';
                ctx.fillRect(x - 60, 20, 120, 20);
            }

            ctx.fillStyle = '#8b0000';
            ctx.fillRect(canvas.width * 0.03, 50, 100, 35);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('WOLPERS', canvas.width * 0.03 + 50, 73);
        }

        function drawWaterFountain(offsetX, offsetY, broken) {
            const x = canvas.width * 0.5 + offsetX;
            const floorY = canvas.height * 0.62;
            const fountainHeight = canvas.height * 0.22;
            const topY = floorY - fountainHeight;

            if (broken) {
                ctx.fillStyle = '#666';
                ctx.fillRect(x - 15, floorY - 25, 30, 25);
                ctx.fillStyle = '#444';
                ctx.beginPath();
                ctx.ellipse(x, floorY - 25, 12, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#4a9fff';
                for (let i = 0; i < 15; i++) {
                    const sprayHeight = 40 + Math.sin(frameCount * 0.15 + i * 0.7) * 70;
                    const sprayX = x + Math.sin(frameCount * 0.1 + i * 0.5) * (15 + i * 3);
                    ctx.beginPath();
                    ctx.ellipse(sprayX, floorY - 25 - sprayHeight + i * 7, 6, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = 'rgba(74, 159, 255, 0.5)';
                const poolSize = 70 + Math.sin(frameCount * 0.05) * 10;
                ctx.beginPath();
                ctx.ellipse(x, floorY + 8, poolSize, 16, 0, 0, Math.PI * 2);
                ctx.fill();
                return;
            }

            ctx.fillStyle = '#777';
            ctx.beginPath();
            ctx.moveTo(x - 30, floorY);
            ctx.lineTo(x + 30, floorY);
            ctx.lineTo(x + 25, floorY - 12);
            ctx.lineTo(x - 25, floorY - 12);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#888';
            ctx.beginPath();
            ctx.moveTo(x - 24, floorY - 12);
            ctx.lineTo(x + 24, floorY - 12);
            ctx.lineTo(x + 20, topY + 35);
            ctx.lineTo(x - 20, topY + 35);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#aaa';
            ctx.beginPath();
            ctx.roundRect(x - 30, topY, 60, 40, 5);
            ctx.fill();

            ctx.fillStyle = '#bbb';
            ctx.beginPath();
            ctx.ellipse(x, topY + 22, 27, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#888';
            ctx.beginPath();
            ctx.ellipse(x, topY + 22, 22, 9, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#6ab7ff';
            ctx.beginPath();
            ctx.ellipse(x, topY + 23, 18, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ccc';
            ctx.beginPath();
            ctx.arc(x, topY + 12, 7, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#666';
            ctx.fillRect(x - 6, topY + 5, 12, 12);

            if (progress > 20) {
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x - 18, floorY - 35);
                ctx.lineTo(x - 14, floorY - 55);
                ctx.stroke();

                if (progress > 50) {
                    ctx.beginPath();
                    ctx.moveTo(x + 16, floorY - 30);
                    ctx.lineTo(x + 20, floorY - 50);
                    ctx.stroke();
                }
            }

            if (progress > 50) {
                ctx.fillStyle = '#4a9fff';
                const dripY = (frameCount * 3) % 70;
                ctx.beginPath();
                ctx.ellipse(x - 22, topY + 45 + dripY, 3, 5, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawJames(pulling) {
            const baseX = canvas.width * 0.5 - 60;
            const baseY = canvas.height * 0.50;

            ctx.save();

            if (pulling && !gameWon) {
                ctx.translate(
                    Math.sin(frameCount * 0.8) * shakeAmount,
                    Math.cos(frameCount * 0.6) * shakeAmount * 0.5
                );
            }

            if (gameWon) {
                hulkTimer++;
                if (hulkTimer % 30 === 0) hulkPose = (hulkPose + 1) % 3;
            }

            const scale = 1.4;
            const x = baseX;
            const y = baseY;

            ctx.fillStyle = '#2a4a7a';
            if (gameWon) {
                ctx.fillRect(x - 22 * scale, y, 16 * scale, 45 * scale);
                ctx.fillRect(x + 6 * scale, y, 16 * scale, 45 * scale);
            } else {
                ctx.fillRect(x - 13 * scale, y, 12 * scale, 40 * scale);
                ctx.fillRect(x + 1 * scale, y, 12 * scale, 40 * scale);
            }

            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.ellipse(x - 7 * scale, y + 43 * scale, 10 * scale, 5 * scale, 0, 0, Math.PI * 2);
            ctx.ellipse(x + 7 * scale, y + 43 * scale, 10 * scale, 5 * scale, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#cc3333';
            ctx.beginPath();
            ctx.moveTo(x - 20 * scale, y - 35 * scale);
            ctx.lineTo(x + 20 * scale, y - 35 * scale);
            ctx.lineTo(x + 18 * scale, y + 5 * scale);
            ctx.lineTo(x - 18 * scale, y + 5 * scale);
            ctx.closePath();
            ctx.fill();

            const armAngle = gameWon ? (hulkPose === 0 ? -1.2 : hulkPose === 1 ? -1.5 : -1.0) : -0.7 + pullDirection * 0.2;

            ctx.save();
            ctx.translate(x - 16 * scale, y - 26 * scale);
            ctx.rotate(armAngle);
            ctx.fillStyle = '#cc3333';
            ctx.fillRect(-5 * scale, 0, 12 * scale, 30 * scale);
            ctx.fillStyle = '#e8c4a0';
            ctx.fillRect(-3 * scale, 26 * scale, 10 * scale, 16 * scale);
            ctx.beginPath();
            ctx.arc(2 * scale, 44 * scale, 8 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.save();
            ctx.translate(x + 16 * scale, y - 26 * scale);
            ctx.rotate(-armAngle);
            ctx.fillStyle = '#cc3333';
            ctx.fillRect(-7 * scale, 0, 12 * scale, 30 * scale);
            ctx.fillStyle = '#e8c4a0';
            ctx.fillRect(-5 * scale, 26 * scale, 10 * scale, 16 * scale);
            ctx.beginPath();
            ctx.arc(0, 44 * scale, 8 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.fillStyle = '#e8c4a0';
            ctx.fillRect(x - 5 * scale, y - 44 * scale, 10 * scale, 12 * scale);

            ctx.beginPath();
            ctx.ellipse(x, y - 54 * scale, 16 * scale, 18 * scale, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#4a3020';
            ctx.beginPath();
            ctx.ellipse(x, y - 66 * scale, 15 * scale, 10 * scale, 0, Math.PI, Math.PI * 2);
            ctx.fill();

            if (gameWon) {
                ctx.strokeStyle = '#3a2515';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(x - 12 * scale, y - 62 * scale);
                ctx.lineTo(x - 4 * scale, y - 58 * scale);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + 12 * scale, y - 62 * scale);
                ctx.lineTo(x + 4 * scale, y - 58 * scale);
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(x - 6 * scale, y - 56 * scale, 5 * scale, 4 * scale, 0, 0, Math.PI * 2);
                ctx.ellipse(x + 6 * scale, y - 56 * scale, 5 * scale, 4 * scale, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#2a0a0a';
                ctx.beginPath();
                ctx.ellipse(x, y - 43 * scale, 12 * scale, 10 * scale, 0, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(x - 6 * scale, y - 54 * scale, 4 * scale, 3 * scale, 0, 0, Math.PI * 2);
                ctx.ellipse(x + 6 * scale, y - 54 * scale, 4 * scale, 3 * scale, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(x - 5 * scale, y - 54 * scale, 2 * scale, 0, Math.PI * 2);
                ctx.arc(x + 7 * scale, y - 53 * scale, 2 * scale, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 100, 100, 0.4)';
                ctx.beginPath();
                ctx.ellipse(x - 10 * scale, y - 47 * scale, 5 * scale, 3 * scale, 0, 0, Math.PI * 2);
                ctx.ellipse(x + 10 * scale, y - 47 * scale, 5 * scale, 3 * scale, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#2a0a0a';
                ctx.beginPath();
                ctx.ellipse(x, y - 43 * scale, 8 * scale, 5 * scale, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#eee';
                ctx.fillRect(x - 6 * scale, y - 45 * scale, 12 * scale, 3 * scale);
            }

            ctx.restore();

            if (gameWon && hulkTimer > 30) {
                ctx.fillStyle = '#ff0';
                ctx.font = 'bold 22px Arial Black';
                ctx.textAlign = 'center';
                ctx.fillText('JAMES!', x, y - 95 * scale);
            }
        }

        function drawStudent(x, y, index) {
            const scale = 0.8;
            const bounce = gameWon ? Math.sin(frameCount * 0.2 + index) * 5 : 0;

            ctx.save();
            ctx.translate(x, y + bounce);

            const shirtColors = ['#3366cc', '#33cc66', '#cc6633', '#9933cc'];
            ctx.fillStyle = shirtColors[index % 4];
            ctx.beginPath();
            ctx.roundRect(-12 * scale, -16 * scale, 24 * scale, 32 * scale, 4);
            ctx.fill();

            ctx.fillStyle = '#2a4a7a';
            ctx.fillRect(-10 * scale, 14 * scale, 8 * scale, 24 * scale);
            ctx.fillRect(2 * scale, 14 * scale, 8 * scale, 24 * scale);

            ctx.fillStyle = '#e8c4a0';
            ctx.beginPath();
            ctx.arc(0, -28 * scale, 14 * scale, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = index % 2 === 0 ? '#2a2020' : '#6a4020';
            ctx.beginPath();
            ctx.arc(0, -34 * scale, 12 * scale, Math.PI, Math.PI * 2);
            ctx.fill();

            if (gameWon) {
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(0, -20 * scale, 5 * scale, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-4 * scale, -30 * scale, 2 * scale, 0, Math.PI * 2);
                ctx.arc(4 * scale, -30 * scale, 2 * scale, 0, Math.PI * 2);
                ctx.fill();
            }

            if (progress > 30 || gameWon) {
                ctx.fillStyle = '#111';
                ctx.fillRect(14 * scale, -20 * scale, 6 * scale, 11 * scale);
                ctx.fillStyle = '#4af';
                ctx.fillRect(15 * scale, -19 * scale, 4 * scale, 8 * scale);
                ctx.fillStyle = '#f00';
                ctx.beginPath();
                ctx.arc(17 * scale, -17 * scale, 1.5 * scale, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function drawProgressBar() {
            const barX = canvas.width * 0.2;
            const barY = canvas.height * 0.16;
            const barWidth = canvas.width * 0.6;
            const barHeight = 25;

            ctx.fillStyle = '#333';
            ctx.fillRect(barX, barY, barWidth, barHeight);

            const fillWidth = (progress / 100) * barWidth;
            const gradient = ctx.createLinearGradient(barX, barY, barX + fillWidth, barY);
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(0.5, '#ffa500');
            gradient.addColorStop(1, '#ff0');
            ctx.fillStyle = gradient;
            ctx.fillRect(barX, barY, fillWidth, barHeight);

            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(barX, barY, barWidth, barHeight);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(`PULL: ${Math.floor(progress)}%`, canvas.width * 0.5, barY + 18);
        }

        function showMessage(text) {
            messageEl.textContent = text;
            messageEl.style.opacity = 1;
            setTimeout(() => { messageEl.style.opacity = 0; }, 1500);
        }

        function handleKeyPress(key) {
            if (gameWon) return;

            if (!gameStarted) {
                gameStarted = true;
                startTime = performance.now();
            }

            if ((key === 'left' && lastKey !== 'left') || (key === 'right' && lastKey !== 'right')) {
                if (lastKey === null || key !== lastKey) {
                    progress += 1.8;
                    shakeAmount = 5;
                    pullDirection = key === 'left' ? -1 : 1;
                    fountainOffset = pullDirection * 3;

                    if (progress >= 100 && !gameWon) {
                        gameWon = true;
                        endTime = performance.now();
                        const finalTime = (endTime - startTime) / 1000;
                        currentTime = finalTime;

                        showMessage('JAMES SMASH!!!');
                        instructionsEl.textContent = `TIME: ${finalTime.toFixed(3)}s`;

                        setTimeout(async () => {
                            await loadLeaderboard(); // Refresh leaderboard
                            if (checkNewRecord(finalTime)) {
                                finalTimeEl.textContent = finalTime.toFixed(3) + 's';
                                nameModal.style.display = 'block';
                                playerNameInput.focus();
                            } else {
                                restartBtn.style.display = 'block';
                            }
                        }, 1500);
                    }
                }
                lastKey = key;
            }
        }

        submitNameBtn.addEventListener('click', async () => {
            const name = playerNameInput.value.trim() || 'Anonymous';
            await addToLeaderboard(name, currentTime);
            nameModal.style.display = 'none';
            restartBtn.style.display = 'block';
        });

        playerNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') submitNameBtn.click();
        });

        restartBtn.addEventListener('click', async () => {
            progress = 0;
            lastKey = null;
            gameWon = false;
            gameStarted = false;
            shakeAmount = 0;
            pullDirection = 0;
            fountainOffset = 0;
            hulkTimer = 0;
            hulkPose = 0;
            startTime = 0;
            currentTime = 0;
            timerEl.textContent = '0.000s';
            instructionsEl.textContent = 'Mash LEFT and RIGHT arrow keys to rip it off!';
            restartBtn.style.display = 'none';
            playerNameInput.value = '';
            await loadLeaderboard(); // Refresh scores
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); handleKeyPress('left'); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); handleKeyPress('right'); }
        });

        document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); handleKeyPress('left'); });
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); handleKeyPress('right'); });
        document.getElementById('leftBtn').addEventListener('click', () => handleKeyPress('left'));
        document.getElementById('rightBtn').addEventListener('click', () => handleKeyPress('right'));

        function update() {
            frameCount++;
            shakeAmount *= 0.9;
            fountainOffset *= 0.9;

            if (!gameWon && progress > 0) progress -= 0.12;

            if (gameStarted && !gameWon) {
                currentTime = (performance.now() - startTime) / 1000;
                timerEl.textContent = currentTime.toFixed(3) + 's';
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawHallway();
            students.forEach((s, i) => drawStudent(canvas.width * s.x, canvas.height * s.y, i));
            drawWaterFountain(fountainOffset, 0, gameWon);
            drawJames(shakeAmount > 0.5);

            if (!gameWon) drawProgressBar();

            if (gameWon) {
                ctx.fillStyle = 'rgba(74, 159, 255, 0.6)';
                for (let i = 0; i < 15; i++) {
                    const wx = canvas.width * 0.5 + Math.sin(frameCount * 0.1 + i * 0.5) * (40 + i * 4);
                    const wy = canvas.height * 0.28 + Math.cos(frameCount * 0.15 + i * 0.3) * 25 + i * 7;
                    ctx.beginPath();
                    ctx.arc(wx, wy, 4 + Math.random() * 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (hulkTimer > 60) {
                    ctx.fillStyle = '#ff0';
                    ctx.font = 'bold 36px Arial Black';
                    ctx.textAlign = 'center';
                    ctx.fillText('LEGENDARY!', canvas.width * 0.5, canvas.height * 0.22);
                }
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
